<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Questionable Hires</title>
  <desc id="desc">Weird, but employed. Unfortunately, essential. Eight suspiciously effective engineering coworkers.</desc>
  <rect width="1200" height="440" rx="20" fill="#131710"/>
  <path d="M0 340H1200M0 341H1200" stroke="#303828"/>
  <rect x="56" y="46" width="228" height="30" rx="4" fill="#D4F26A"/>
  <text x="70" y="67" font-family="monospace" font-size="14" font-weight="700" fill="#131710">ENGINEERING / PERSONNEL</text>
  <text x="56" y="153" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-3" fill="#F5F6ED">questionable-hires</text>
  <text x="60" y="206" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#D4F26A">Weird, but employed. Unfortunately, essential.</text>
  <text x="60" y="272" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#AAB39D">One demands receipts. One charges your abstractions rent.</text>
  <text x="60" y="301" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#AAB39D">One talks to developers who left in 2019.</text>
  <text x="60" y="382" font-family="monospace" font-size="14" fill="#D4F26A">08 HIRES</text>
  <text x="260" y="382" font-family="monospace" font-size="14" fill="#D5DACC">EVIDENCE REQUIRED</text>
  <text x="590" y="382" font-family="monospace" font-size="14" fill="#D5DACC">SUPERVISION ADVISED</text>
  <text x="978" y="382" font-family="monospace" font-size="14" fill="#D5DACC">EST. 2026</text>
  <text x="60" y="410" font-family="monospace" font-size="11" fill="#77816A">HIRING WAS A MISTAKE. FIRING THEM WOULD BE WORSE.</text>
</svg>
