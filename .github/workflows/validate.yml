name: Validate hires

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - name: Check localized benchmark and generated charts
        run: python -B scripts/sync_featured_benchmark.py --check
      - run: python -m unittest discover -s tests -v
      - run: git diff --check

  source-archive:
    name: Source archive / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate the committed source distribution without checkout state
        shell: bash
        run: |
          set -euo pipefail
          archive_root=$(mktemp -d "${RUNNER_TEMP}/hires-archive.XXXXXX")
          git archive --format=tar HEAD | tar -xf - -C "$archive_root"
          cd "$archive_root"
          test ! -e .git
          test ! -e benchmarks/local-runs
          python scripts/validate.py
          python -B scripts/sync_featured_benchmark.py --check
          python -B -m unittest discover -s tests -v
