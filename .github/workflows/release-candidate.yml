name: Prepare release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and verify the exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_root=$(mktemp -d "${RUNNER_TEMP}/qh-candidate.XXXXXX")
          artifact_root="$candidate_root/artifact"
          mkdir "$artifact_root" "$candidate_root/extracted"
          python -B scripts/package_skills.py --output "$artifact_root/questionable-hires.tar.gz"
          python -B scripts/package_skills.py --output "$candidate_root/repeated.tar.gz"
          cmp "$artifact_root/questionable-hires.tar.gz" "$candidate_root/repeated.tar.gz"
          tar -xzf "$artifact_root/questionable-hires.tar.gz" -C "$candidate_root/extracted"
          python -B benchmarks/scan_evidence.py "$candidate_root/extracted/questionable-hires"
          python -I -B "$candidate_root/extracted/questionable-hires/scripts/install.py" --dest "$candidate_root/consumer/.agents/skills"
          python -I -B "$candidate_root/extracted/questionable-hires/scripts/install.py" --dest "$candidate_root/consumer/.agents/skills" --check
          printf '%s\n' "$GITHUB_SHA" > "$artifact_root/SOURCE_COMMIT"
          (cd "$artifact_root" && shasum -a 256 questionable-hires.tar.gz > SHA256SUMS)
          printf 'directory=%s\n' "$artifact_root" >> "$GITHUB_OUTPUT"
      - name: Retain candidate files only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-${{ github.sha }}
          path: ${{ steps.candidate.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
