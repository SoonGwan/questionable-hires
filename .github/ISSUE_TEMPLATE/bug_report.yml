name: Report a questionable decision
description: Report a skill decision, installation failure, or packaging problem.
title: '[bug] '
body:
  - type: input
    id: hire
    attributes:
      label: Affected skill or tool, and version or commit
      placeholder: receipt, scripts/install.py, or scripts/build.py at a commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Relevant environment
      description: For skill behavior, include model, reasoning and host version. For installer/build failures, include OS, Python version and the command used; model details are unnecessary.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal request and reproduction
      description: Use synthetic or public code. Remove secrets and private project data.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected behavior and actual result
      description: Include relevant commands or evidence, plus any other loaded skills.
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Result without this skill, if available
      description: A comparison helps, but is not required to report a bug.
