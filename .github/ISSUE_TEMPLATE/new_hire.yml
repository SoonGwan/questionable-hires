name: Refer a suspicious coworker
description: Propose a distinct engineering habit worth hiring.
title: '[hire] '
body:
  - type: input
    id: name
    attributes:
      label: Name and one-line character
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: What actual engineering decision improves?
      description: Explain when this hire starts, what evidence it produces, and when it stops.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: A realistic task and why existing hires don't cover it
    validations:
      required: true
